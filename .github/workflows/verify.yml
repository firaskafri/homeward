name: Verify

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: homeward-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Core, native tests, analysis, and release build
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Require Apple Silicon
        run: test "$(uname -m)" = arm64

      - name: Select Xcode 16.4
        run: |
          sudo xcode-select --switch /Applications/Xcode_16.4.app
          test "$(xcodebuild -version | sed -n '1p')" = "Xcode 16.4"

      - name: Install pinned XcodeGen
        env:
          XCODEGEN_SHA256: 4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806
          XCODEGEN_VERSION: 2.46.0
        run: |
          archive="$RUNNER_TEMP/xcodegen.zip"
          install_root="$RUNNER_TEMP/xcodegen"
          curl --fail --location --show-error \
            "https://github.com/yonaskolb/XcodeGen/releases/download/${XCODEGEN_VERSION}/xcodegen.zip" \
            --output "$archive"
          echo "${XCODEGEN_SHA256}  ${archive}" | shasum -a 256 --check
          unzip -q "$archive" -d "$install_root"
          sudo bash "$install_root/xcodegen/install.sh"
          test "$(xcodegen version | awk '{print $2}')" = "$XCODEGEN_VERSION"

      - name: Verify without interactive UI automation
        run: RUN_UI_TESTS=0 ./scripts/verify.sh

      - name: Package unreleased test candidate
        run: SKIP_VERIFY=1 ./scripts/package-local-candidate.sh

      - name: Upload release-candidate evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: homeward-local-candidate-${{ github.sha }}
          path: dist/
          retention-days: 14
