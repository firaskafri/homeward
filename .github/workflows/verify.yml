name: Verify

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: homeward-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Core, native tests, analysis, and release build
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Require Apple Silicon
        run: test "$(uname -m)" = arm64

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Verify without interactive UI automation
        run: RUN_UI_TESTS=0 ./scripts/verify.sh

      - name: Package non-public release candidate
        run: SKIP_VERIFY=1 ./scripts/package-local-candidate.sh

      - name: Upload release-candidate evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: homeward-local-candidate-${{ github.sha }}
          path: dist/
          retention-days: 14
